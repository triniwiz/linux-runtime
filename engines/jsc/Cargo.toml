[package]
name = "nativescript-jsc"
description = "NativeScript Linux runtime on JavaScriptCore (WebKitGTK's libjavascriptcoregtk + napi-android JSC shim)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ns-linux-jsc"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
nativescript-napi = { path = "../../napi", features = ["compat"] }
nativescript-napi-buffer = { path = "../buffer" }
