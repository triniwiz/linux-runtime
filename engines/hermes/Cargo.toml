[package]
name = "nativescript-hermes"
description = "NativeScript Linux runtime on Hermes (microsoft/hermes-windows' Node-API, built for Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ns-linux-hermes"
path = "src/main.rs"

[dependencies]
nativescript-napi = { path = "../../napi", features = ["compat"] }
nativescript-napi-buffer = { path = "../buffer" }
