[package]
name = "nativescript-napi"
description = "NativeScript Linux runtime written against Node-API (engine independent)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nativescript-core.workspace = true
nativescript-metadata.workspace = true
libffi.workspace = true
libc.workspace = true
url = "2"
serde_json = "1"
# module_runner: ES module transform (oxc pinned)
oxc = { version = "=0.145.0", default-features = false, features = ["semantic", "codegen", "ast_visit"], optional = true }
oxc_transformer_plugins = { version = "=0.145.0", optional = true }
ureq = { version = "2", optional = true }

[features]
default = ["engine", "module_runner"]
# runs its own engine through the js_* host functions (off: a Node-API addon, see addon.rs)
engine = []
# ES modules through a JS module runner (engines without a module loader)
module_runner = ["engine", "dep:oxc", "dep:oxc_transformer_plugins", "dep:ureq"]
# node_api.h functions for engines whose shim lacks them
compat = []
