name: npm release

# Publishes @nativescript/linux (V8), the Node-API engine packages
# @nativescript/linux-{quickjs,v8,jsc,hermes} and the @nativescript/linux-napi addon via npm OIDC
# trusted publishing. The trusted
# publisher matches repository + workflow FILENAME + environment, so renaming this file or the
# `npm-publish` environment breaks publishing; each package needs its own entry on npmjs.com.
#
# No `paths` filter next to the tag trigger: a tag push can have an empty changed-file set, and
# paths + tags together silently skip the run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      engine:
        description: "Which package to release"
        type: choice
        required: true
        default: all
        options: [all, classic, quickjs, v8, jsc, hermes, napi]
      version:
        description: "Version to cut, e.g. 0.1.0-alpha.2 (dist-tag = prerelease id, plain version = latest). Empty: rolling 'next'."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# setup (version + package matrix) -> build (one job per arch, every selected package)
# -> pack (merge x64 + arm64 into one package each) -> publish (npm, OIDC)
jobs:
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.out.outputs.NPM_VERSION }}
      npm_tag: ${{ steps.out.outputs.NPM_TAG }}
      packages: ${{ steps.out.outputs.PACKAGES }}
      engines: ${{ steps.out.outputs.ENGINES }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          # dependency caching is a cache-poisoning vector in a publishing workflow
          package-manager-cache: false
      - name: Compute version, dist-tag and packages
        id: out
        env:
          # env indirection keeps the dispatch inputs out of shell interpolation
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENGINE: ${{ inputs.engine || 'all' }}
        run: node ./scripts/resolve-release.mjs --version "$INPUT_VERSION" --engine "$INPUT_ENGINE"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: setup
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      NPM_VERSION: ${{ needs.setup.outputs.npm_version }}
      ENGINES: ${{ needs.setup.outputs.engines }}
      PACKAGES: ${{ needs.setup.outputs.packages }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          jsc: ${{ contains(needs.setup.outputs.engines, 'jsc') }}
      - name: Cache Hermes
        if: ${{ contains(needs.setup.outputs.engines, 'hermes') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/hermes/vendor
          key: hermes-${{ runner.arch }}-${{ hashFiles('engines/hermes/build-hermes.sh', 'engines/hermes/csrc/**') }}
      - name: Build Hermes
        if: ${{ contains(needs.setup.outputs.engines, 'hermes') }}
        run: |
          [ -f "engines/hermes/vendor/$(uname -m)/libhermes.a" ] || engines/hermes/build-hermes.sh
      - name: Build packages
        env:
          STRICT: "1"
        run: scripts/pack-npm.sh "$NPM_VERSION"
      # artifacts drop file modes, so the package trees travel as a tarball
      - name: Archive the selected packages
        run: |
          dirs=$(node -e 'console.log(JSON.parse(process.env.PACKAGES).include.map((p) => p.dir).join(" "))')
          tar -czf "npm-${{ matrix.arch }}.tar.gz" -C dist/npm $dirs
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-${{ matrix.arch }}
          path: npm-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  pack:
    name: Pack ${{ matrix.engine }}
    runs-on: ubuntu-latest
    needs: [setup, build]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.packages) }}
    env:
      DIR: ${{ matrix.dir }}
      TARBALL: ${{ matrix.tarball }}
    steps:
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          merge-multiple: true
      # arch specific files have arch specific paths (runtime/<arch>, tools/<arch>,
      # linux.<arch>.node, metadata-<arch>.bin); everything else is the same in both
      - name: Merge x64 and arm64
        run: |
          mkdir -p x64 arm64 out
          tar -xzf npm-x64.tar.gz -C x64
          tar -xzf npm-arm64.tar.gz -C arm64
          cp -a "x64/$DIR" out/
          cp -an "arm64/$DIR/." "out/$DIR/"
          for arch in x64 arm64; do
            if [ "$DIR" = linux-napi ]; then
              test -f "out/$DIR/linux.$arch.node"
            else
              test -x "out/$DIR/framework/runtime/$arch/ns-linux"
            fi || { echo "::error::$DIR has no $arch build"; exit 1; }
          done
      - name: npm pack
        run: |
          mkdir -p dist
          (cd "out/$DIR" && npm pack --pack-destination ../../dist)
          test -f "dist/$TARBALL"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-package-${{ matrix.engine }}
          path: dist/${{ matrix.tarball }}
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.engine }}
    runs-on: ubuntu-latest
    # part of the npm trusted-publisher match, see the header note before renaming
    environment: npm-publish
    needs: [setup, pack]
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.packages) }}
    env:
      NPM_VERSION: ${{ needs.setup.outputs.npm_version }}
      NPM_TAG: ${{ needs.setup.outputs.npm_tag }}
      NPM_NAME: ${{ matrix.npm_name }}
      TARBALL: ${{ matrix.tarball }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ matrix.engine }}
          path: dist
      - name: Update npm (required for OIDC trusted publishing)
        run: |
          corepack enable npm
          corepack install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"
      - name: Publish (OIDC trusted publishing)
        if: ${{ vars.USE_NPM_TOKEN != 'true' }}
        run: |
          echo "Publishing $NPM_NAME@$NPM_VERSION with tag $NPM_TAG via OIDC..."
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then rm -f "$NPM_CONFIG_USERCONFIG"; fi
          npm publish "./dist/$TARBALL" --tag "$NPM_TAG" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""
      - name: Publish (granular token)
        if: ${{ vars.USE_NPM_TOKEN == 'true' }}
        run: |
          echo "Publishing $NPM_NAME@$NPM_VERSION with tag $NPM_TAG via token..."
          npm publish "./dist/$TARBALL" --tag "$NPM_TAG" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
